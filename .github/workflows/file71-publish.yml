name: File71 Publish

on:
  push:
    branches: [file71-engine]
    paths: ["f71/**", ".github/workflows/file71-publish.yml"]
  schedule:
    # Once a day, 22:30 UTC = 00:30 Cairo (YouTube daily upload cap)
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video without uploading"
        type: boolean
        default: true
      privacy:
        description: "unlisted / private / public"
        default: "unlisted"

permissions:
  contents: write

concurrency:
  group: file71-publish-b
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled/real runs stay off until repo variable FILE71_ENABLED is "true"; push and manual dry runs always allowed (dry only)
    if: ${{ vars.FILE71_ENABLED == 'true' || github.event_name == 'push' || github.event.inputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        idx: ${{ github.event_name == 'push' && fromJSON('["0","1","2"]') || fromJSON('[""]') }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: f71
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: f71/requirements.txt
      - name: Check publisher exists
        run: test -f scripts/video_publish.py
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install python deps
        run: pip install -r requirements.txt
      - name: Build and publish one video
        env:
          TOPIC_INDEX: ${{ matrix.idx }}
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || github.event.inputs.dry_run || 'false' }}
          PRIVACY_STATUS: ${{ github.event.inputs.privacy || vars.PRIVACY_STATUS || 'unlisted' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/video_publish.py
      - name: Upload preview files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file71-preview-${{ matrix.idx || 'run' }}
          path: f71/preview/
          retention-days: 3
          if-no-files-found: ignore

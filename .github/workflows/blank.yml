name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/money-printer-turbo/**/*.py'
      - 'tools/**/*.ps1.bat'
      - 'tools/**/*.bat'
      - '.github/workflows/blank.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/money-printer-turbo/**/*.py'
      - 'tools/**/*.ps1.bat'
      - 'tools/**/*.bat'
      - '.github/workflows/blank.yml'
  workflow_dispatch:

# Do not keep duplicate validation jobs for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Python syntax and layout check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m compileall -q apps/money-printer-turbo/app apps/money-printer-turbo/webui apps/money-printer-turbo/cli.py apps/money-printer-turbo/main.py
      - name: Check required integration files
        run: |
          test -f apps/money-printer-turbo/pyproject.toml
          test -f apps/money-printer-turbo/config.example.toml
          test -f README.md
